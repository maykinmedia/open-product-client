services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust

  web:
    image: maykinmedia/open-product:${TAG:-1.9.0}
    pull_policy: always
    environment: &web-env
      - DJANGO_SETTINGS_MODULE=openproduct.conf.docker
      - IS_HTTPS=no
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_HOST=db
      - ALLOWED_HOSTS=*
      - CACHE_DEFAULT=redis:6379/0
      - CACHE_AXES=redis:6379/0
      - SUBPATH=${SUBPATH:-/}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-f8s@b*ds4t84-q_2#c0j0506@!l2q6r5_pq5e!vm^_9c*#^66b}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DISABLE_2FA=true
    ports:
      # Use a somewhat arbitrary port to avoid clashes
      - 8339:8000
    depends_on:
      - db
      - redis

  redis:
    image: redis
